<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>気象庁 震源マップ</title>
  <meta name="description" content="気象庁 地震月報(カタログ編) の震源データ（1919〜2023年・約508万件）を深さ方向に配置して立体表示するビューワ" />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div id="map"></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌏</span>
        <h1>気象庁 震源マップ<br /><span class="brand-sub">1919年〜2023年</span></h1>
      </div>
      <div class="head-actions">
        <button id="share-btn" class="icon-btn" type="button" title="この画面のURLをコピー" aria-label="この画面のURLをコピー">🔗</button>
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <div class="field">
        <div class="field-head">
          <span class="field-label">レイヤー</span>
        </div>
        <div id="layers" class="toggles"></div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">震源の深さ</span>
        </div>
        <p class="depth3d-note">震源は深さ方向にも配置しています。地図を傾けると立体に見え、深さの凡例が出ます。右クリックのドラッグ、または Ctrl キーを押しながらのドラッグで傾けられます。</p>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">収録データ</span>
        </div>
        <dl id="dataset-info" class="dataset-info"></dl>
      </div>
    </div>

    <footer class="panel-foot">
      震度データ・震源データ: <a href="https://www.data.jma.go.jp/eqev/data/bulletin/shindo.html" target="_blank" rel="noopener">気象庁 地震月報(カタログ編)</a><br />
      人口集中地区: <a href="https://www.e-stat.go.jp/gis" target="_blank" rel="noopener">政府統計の総合窓口（e-Stat）</a><br />
      背景: 国土地理院 最適化ベクトルタイル / 全国最新写真<br />
      <a href="https://github.com/shiwaku/jma-earthquake-data-converter" target="_blank" rel="noopener">GitHub</a>
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <!-- 深さの凡例。パネルを畳んでも読めるよう地図上に出す（参考実装と同じ置き方）。 -->
  <div id="depth3d-legend" class="depth-legend" aria-hidden="true" hidden>
    <div class="dl-bar"></div>
    <div class="dl-ticks"></div>
  </div>

  <!-- 地震の選択はパネルの外に常設する。パネルを畳んでも切り替えられるようにするため
       （スマホではパネルが初期状態で畳まれる）。 -->
  <section id="eventbar" class="eventbar" aria-label="地震の選択">
    <div id="event-current" class="event-current" aria-live="polite" hidden></div>
    <div class="eb-search">
      <input id="event-q" type="search" class="event-q" autocomplete="off"
        placeholder="震央地名・年月日・M・震度で検索" aria-label="地震を検索"
        role="combobox" aria-expanded="false" aria-controls="event-list" />
      <div id="event-pop" class="event-pop" hidden>
        <p id="event-status" class="event-status" role="status"></p>
        <ul id="event-list" class="event-list"></ul>
      </div>
    </div>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
