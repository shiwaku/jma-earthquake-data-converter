name: 変換パイプライン

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: '取得開始年'
        required: true
        default: '1919'
      end_year:
        description: '取得終了年（空なら配信されている最新年）'
        required: false
        default: ''
      release_tag:
        description: '成果物を公開するリリースのタグ（例: data-v2）。空なら公開しない'
        required: false
        default: ''

env:
  TIPPECANOE_VERSION: '2.79.0'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas geopandas pyarrow

      - name: tippecanoeをキャッシュから復元
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}

      - name: tippecanoeをビルド
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe/tippecanoe ~/.local/bin/

      - name: tippecanoeをPATHに追加
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chmod +x ~/.local/bin/tippecanoe

      - name: 作業ディレクトリを用意
        run: mkdir -p work

      - name: 震度データを取得
        working-directory: work
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          if [ -n "$END_YEAR" ]; then
            python ../src/shindo_zip_dl.py --start "$START_YEAR" --end "$END_YEAR"
          else
            python ../src/shindo_zip_dl.py --start "$START_YEAR"
          fi

      - name: 震源データを取得
        working-directory: work
        run: python ../src/hypo_zip_dl.py

      - name: zipを展開
        working-directory: work
        run: |
          mkdir -p shindo_dat
          unzip -o -q 'shindo_zip/i*.zip' -d shindo_dat
          unzip -o -q shindo_zip/code_p.zip -d .
          echo "展開: $(ls shindo_dat | wc -l)ファイル"

      - name: 観測点一覧を変換
        working-directory: work
        run: python ../src/code_p2csv.py

      - name: 震源データ・震度データを抽出
        working-directory: work
        run: python ../src/dat_converter.py

      - name: 震源データを変換
        working-directory: work
        run: python ../src/hypocenter_converter.py

      - name: 震度データを変換
        working-directory: work
        run: python ../src/shindo_converter.py

      - name: 震源データ（無感含む）を変換
        working-directory: work
        run: python ../src/hypo_dat_converter.py hypo_zip hypo_catalog.csv

      # ogr2ogrのParquetドライバはUbuntuのgdal-binに含まれない場合があるためgeopandasを使う
      - name: GeoParquetへ変換
        working-directory: work
        run: |
          python ../src/csv2geoparquet.py shindo_hypocenter.csv shindo_hypocenter.parquet --lon Longitude --lat Latitude --string 地震ID
          python ../src/csv2geoparquet.py shindo_intensity.csv shindo_intensity.parquet --lon 観測点経度 --lat 観測点緯度 --string 地震ID --string 観測点番号
          python ../src/csv2geoparquet.py hypo_catalog.csv hypo_catalog.parquet --lon Longitude --lat Latitude --string 地震ID

      # tippecanoeの入力にする。地震IDは文字列のまま出す必要がある（ビューワが文字列で比較するため）
      - name: 行区切りGeoJSONへ変換
        working-directory: work
        run: |
          python ../src/csv2geojsonseq.py shindo_hypocenter.csv shindo_hypocenter.geojsonl --lon Longitude --lat Latitude --number '深さ(km)' --number マグニチュード1 --number マグニチュード2 --number 観測点数 --number UnixTime
          python ../src/csv2geojsonseq.py shindo_intensity.csv shindo_intensity.geojsonl --lon 観測点経度 --lat 観測点緯度 --number '震度（計測値）'

      # -l でレイヤー名を明示する。ビューワの source-layer と一致させる必要がある
      - name: PMTilesへ変換
        working-directory: work
        run: |
          set -euo pipefail
          tippecanoe -zg -o shindo_hypocenter.pmtiles -l shindo_hypocenter -r1 -pf -pk -P --force shindo_hypocenter.geojsonl
          tippecanoe -zg -B7 -rg -o shindo_intensity.pmtiles -l shindo_intensity -r1 -d8 -pf -pk -P --force shindo_intensity.geojsonl

      - name: 成果物を確認
        working-directory: work
        run: |
          ls -lh shindo_hypocenter.csv shindo_intensity.csv hypo_catalog.csv *.parquet *.pmtiles
          python - <<'PY'
          import csv
          import sys
          for path in ('shindo_hypocenter.csv', 'shindo_intensity.csv', 'hypo_catalog.csv'):
              with open(path, encoding='utf-8', newline='') as file:
                  rows = sum(1 for _ in csv.DictReader(file))
              print(f'{path}: {rows}行')
              if rows == 0:
                  sys.exit(f'{path} が空です')
          PY

      - name: 観測点一覧とマニフェストを更新
        run: |
          cp work/code_p.dat data/code_p.dat
          cp work/code_p.csv data/code_p.csv
          # 差分ありの場合に終了コード1を返すため、ここでは失敗扱いにしない
          python src/check_updates.py --update || true
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add data/
            git commit -m 'chore(data): 観測点一覧とマニフェストを更新'
            git push
          else
            echo '更新なし'
          fi

      # CSVはgzipで固める。shindo_intensity.csv（約216MB）はリリースアセットには置けるが重いため
      - name: Releasesに公開
        if: inputs.release_tag != ''
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          for name in shindo_hypocenter shindo_intensity hypo_catalog; do
            gzip -9 -n -c "$name.csv" > "release/$name.csv.gz"
            cp "$name.parquet" release/
          done
          cp shindo_hypocenter.pmtiles shindo_intensity.pmtiles release/
          (cd release && sha256sum *.csv.gz *.parquet *.pmtiles > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "変換済みデータ ${TAG}" --notes "気象庁 地震月報(カタログ編) 震度データ・震源データの変換結果。生成: $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          gh release upload "$TAG" --clobber release/*
